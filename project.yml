name: Flint
options:
  bundleIdPrefix: app.phoenixclips
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Flint:
    type: application
    platform: macOS
    sources:
      - Flint
    settings:
      base:
        PRODUCT_NAME: Flint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.phoenixclips.FlintNotch
    info:
      path: Flint/Info.plist
      properties:
        CFBundleDisplayName: Flint
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSAudioCaptureUsageDescription: Flint routes each app's sound to the speakers and volume you pick in the notch.
        NSLocationUsageDescription: Flint uses your rough location to show the local weather in the notch and on the lock screen.
        NSAppleEventsUsageDescription: Flint reads the current song from Music and Spotify so it can show it in the notch and control playback.
    entitlements:
      path: Flint/Flint.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.location: true
